{% extends "base.html" %}

{% block title %}Edit profile · Learning Companion{% endblock %}

{% block content %}
  <h1>Edit profile</h1>
  {% if not form.fields.focus_areas.queryset.exists %}
    <p>No focus areas available yet.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit">Save</button>
  </form>
{% endblock %}
